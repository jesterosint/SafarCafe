<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safar</title>
    <!-- ШРИФТ -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- ИКОНКИ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f7f5f0;
            color: #1e1e1e;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .hidden {
            display: none !important;
        }

        /* ===== АВТОРИЗАЦИЯ ===== */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .auth-overlay.exit {
            animation: fadeOut 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.97); }
        }

        .auth-card {
            background: #ffffff;
            border-radius: 40px;
            padding: 40px 32px 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .auth-card .logo {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -1px;
            color: #1e1e1e;
            margin-bottom: 2px;
        }
        .auth-card .logo span {
            color: #c9a94e;
        }
        .auth-card .sub {
            text-align: center;
            color: #8a8580;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .auth-card .error {
            color: #d14c4c;
            font-size: 13px;
            text-align: center;
            min-height: 22px;
            margin-bottom: 4px;
        }
        .auth-card input {
            width: 100%;
            padding: 16px 18px;
            border: 1.5px solid #e8e4de;
            border-radius: 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background: #faf8f5;
            outline: none;
            transition: 0.25s;
            margin-bottom: 12px;
        }
        .auth-card input:focus {
            border-color: #1e1e1e;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(30, 30, 30, 0.04);
        }
        .auth-card .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s;
            margin-bottom: 10px;
        }
        .auth-card .btn:active {
            transform: scale(0.96);
        }
        .auth-card .btn-primary {
            background: #1e1e1e;
            color: #fff;
        }
        .auth-card .btn-primary:hover {
            background: #2a2a2a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .auth-card .btn-google {
            background: #fff;
            color: #1e1e1e;
            border: 1.5px solid #e8e4de;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .auth-card .btn-google:hover {
            background: #faf8f5;
        }
        .auth-card .btn-google i {
            font-size: 18px;
        }
        .auth-card .switch {
            text-align: center;
            font-size: 14px;
            color: #8a8580;
            margin-top: 4px;
        }
        .auth-card .switch a {
            color: #1e1e1e;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .auth-card .switch a:active {
            opacity: 0.6;
        }
        .auth-card .user-info {
            background: #faf8f5;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            font-size: 14px;
            color: #8a8580;
            margin-bottom: 16px;
        }
        .auth-card .user-info strong {
            color: #1e1e1e;
        }

        /* ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== */
        .app {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }
        .app.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        /* Хедер */
        .app-header {
            background: #1e1e1e;
            color: #fff;
            padding: 18px 20px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .app-header h1 span {
            color: #c9a94e;
        }
        .app-header .logout-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            padding: 6px 14px;
            border-radius: 30px;
        }
        .app-header .logout-btn:active {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Категории */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 16px 16px 10px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: #e8e4de;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            color: #1e1e1e;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            flex-shrink: 0;
        }
        .cat-btn.active {
            background: #1e1e1e;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .cat-btn:active {
            transform: scale(0.92);
        }

        /* Меню */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 12px 16px 100px;
        }
        .menu-card {
            background: #fff;
            border-radius: 24px;
            padding: 18px 16px 18px;
            border: 1px solid #ede9e4;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            animation: cardIn 0.5s ease backwards;
        }
        .menu-card:nth-child(1) { animation-delay: 0.05s; }
        .menu-card:nth-child(2) { animation-delay: 0.10s; }
        .menu-card:nth-child(3) { animation-delay: 0.15s; }
        .menu-card:nth-child(4) { animation-delay: 0.20s; }
        .menu-card:nth-child(5) { animation-delay: 0.25s; }
        .menu-card:nth-child(6) { animation-delay: 0.30s; }
        .menu-card:nth-child(7) { animation-delay: 0.35s; }
        .menu-card:nth-child(8) { animation-delay: 0.40s; }

        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .menu-card:active {
            transform: scale(0.97);
            border-color: #c9a94e;
        }
        .menu-card .icon {
            font-size: 32px;
            color: #c9a94e;
            margin-bottom: 4px;
        }
        .menu-card .name {
            font-weight: 700;
            font-size: 17px;
        }
        .menu-card .desc {
            font-size: 13px;
            color: #8a8580;
            margin: 2px 0 8px;
        }
        .menu-card .price {
            font-weight: 700;
            font-size: 18px;
            margin-top: auto;
        }
        .menu-card .price span {
            font-weight: 400;
            font-size: 13px;
            color: #8a8580;
        }
        .menu-card .add-btn {
            background: #1e1e1e;
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .menu-card .add-btn:active {
            transform: scale(0.94);
        }
        .menu-card .add-btn.added {
            background: #c9a94e;
            color: #1e1e1e;
        }

        /* Корзина (нижняя панель) */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 14px 20px;
            border-top: 1px solid #ede9e4;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 60;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.04);
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .cart-bar.active {
            display: flex;
        }
        .cart-bar .total {
            font-weight: 700;
            font-size: 20px;
        }
        .cart-bar .order-btn {
            background: #1e1e1e;
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 14px 32px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-bar .order-btn:active {
            transform: scale(0.94);
        }

        /* Тосты */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 20px;
            right: 20px;
            background: #1e1e1e;
            color: #fff;
            padding: 16px 22px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 100;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Адаптив */
        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 20px 28px;
            }
            .menu-grid {
                gap: 12px;
                padding: 12px 12px 100px;
            }
            .menu-card {
                padding: 14px 12px 16px;
            }
            .cart-bar {
                padding: 12px 16px;
            }
            .cart-bar .total {
                font-size: 17px;
            }
            .cart-bar .order-btn {
                padding: 12px 24px;
                font-size: 14px;
            }
            .app-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ТОСТ ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== АВТОРИЗАЦИЯ ===== -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <div class="logo">SAFAR</div>
            <div class="sub">Войдите или создайте аккаунт</div>
            <div class="error" id="authError"></div>

            <div id="loginForm">
                <input type="email" id="loginEmail" placeholder="Почта">
                <input type="password" id="loginPassword" placeholder="Пароль">
                <button class="btn btn-primary" id="loginBtn">Войти</button>
                <button class="btn btn-google" id="googleLoginBtn"><i class="fab fa-google"></i> Войти через Google</button>
                <div class="switch">Нет аккаунта? <a id="switchToRegister">Зарегистрироваться</a></div>
            </div>

            <div id="registerForm" class="hidden">
                <input type="text" id="regName" placeholder="Имя">
                <input type="email" id="regEmail" placeholder="Почта">
                <input type="password" id="regPassword" placeholder="Пароль (мин. 6)">
                <button class="btn btn-primary" id="registerBtn">Зарегистрироваться</button>
                <div class="switch">Уже есть аккаунт? <a id="switchToLogin">Войти</a></div>
            </div>

            <div id="userInfo" class="hidden">
                <div class="user-info">Вы вошли как <strong id="userNameDisplay"></strong></div>
                <button class="btn btn-primary" id="logoutFromAuthBtn">Выйти</button>
            </div>
        </div>
    </div>

    <!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
    <div class="app" id="app">
        <header class="app-header">
            <h1>SAFAR</h1>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </header>

        <div class="categories" id="categories">
            <button class="cat-btn active" data-cat="all">Все</button>
            <button class="cat-btn" data-cat="coffee">Кофе</button>
            <button class="cat-btn" data-cat="dessert">Десерты</button>
            <button class="cat-btn" data-cat="drinks">Напитки</button>
        </div>

        <div class="menu-grid" id="menuGrid"></div>

        <div class="cart-bar" id="cartBar">
            <span class="total" id="cartTotal">0 ₽</span>
            <button class="order-btn" id="orderBtn"><i class="fas fa-shopping-bag"></i> Заказать</button>
        </div>
    </div>

    <script>
        // ===== МЕНЮ =====
        const menuItems = [
            { id: 1, name: 'Эспрессо', desc: 'Классический крепкий кофе', price: 180, icon: 'fa-mug-saucer', cat: 'coffee' },
            { id: 2, name: 'Капучино', desc: 'Нежный кофе с молочной пенкой', price: 220, icon: 'fa-mug-hot', cat: 'coffee' },
            { id: 3, name: 'Латте', desc: 'Кофе с большим количеством молока', price: 240, icon: 'fa-mug-hot', cat: 'coffee' },
            { id: 4, name: 'Чизкейк', desc: 'Нежный творожный десерт', price: 280, icon: 'fa-cake', cat: 'dessert' },
            { id: 5, name: 'Тирамису', desc: 'Итальянский кофейный десерт', price: 310, icon: 'fa-cake', cat: 'dessert' },
            { id: 6, name: 'Круассан', desc: 'Хрустящая выпечка с начинкой', price: 190, icon: 'fa-bread-slice', cat: 'dessert' },
            { id: 7, name: 'Сок апельсиновый', desc: 'Свежевыжатый сок', price: 160, icon: 'fa-glass', cat: 'drinks' },
            { id: 8, name: 'Матча латте', desc: 'Зелёный чай с молоком', price: 260, icon: 'fa-leaf', cat: 'drinks' },
        ];

        let cart = [];
        let currentUser = null;

        // ===== ХРАНЕНИЕ =====
        function loadUsers() {
            try { return JSON.parse(localStorage.getItem('safar_users')) || []; } catch { return []; }
        }

        function saveUsers(users) {
            localStorage.setItem('safar_users', JSON.stringify(users));
        }

        function getCurrentUser() {
            try { return JSON.parse(localStorage.getItem('safar_current_user')); } catch { return null; }
        }

        function setCurrentUser(user) {
            localStorage.setItem('safar_current_user', JSON.stringify(user));
        }

        // ===== ТОСТ =====
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ===== РЕНДЕР МЕНЮ =====
        function renderMenu(category = 'all') {
            const grid = document.getElementById('menuGrid');
            const filtered = category === 'all' ? menuItems : menuItems.filter(i => i.cat === category);
            grid.innerHTML = filtered.map(item => {
                const inCart = cart.some(c => c.id === item.id);
                return `
                    <div class="menu-card">
                        <div class="icon"><i class="fas ${item.icon}"></i></div>
                        <div class="name">${item.name}</div>
                        <div class="desc">${item.desc}</div>
                        <div class="price">${item.price} <span>₽</span></div>
                        <button class="add-btn ${inCart ? 'added' : ''}" data-id="${item.id}">
                            ${inCart ? '<i class="fas fa-check"></i> В корзине' : '<i class="fas fa-plus"></i> Добавить'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        // ===== ОБНОВЛЕНИЕ КОРЗИНЫ =====
        function updateCart() {
            const bar = document.getElementById('cartBar');
            const total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('cartTotal').textContent = total + ' ₽';
            if (cart.length > 0) {
                bar.classList.add('active');
            } else {
                bar.classList.remove('active');
            }
            renderMenu(document.querySelector('.cat-btn.active')?.dataset.cat || 'all');
        }

        // ===== СОБЫТИЯ =====
        document.addEventListener('click', function(e) {
            // Добавление в корзину
            const addBtn = e.target.closest('.add-btn');
            if (addBtn) {
                const id = parseInt(addBtn.dataset.id);
                const item = menuItems.find(i => i.id === id);
                if (!item) return;
                const idx = cart.findIndex(c => c.id === id);
                if (idx === -1) {
                    cart.push({ ...item });
                    showToast(`✅ ${item.name} добавлен`);
                } else {
                    cart.splice(idx, 1);
                    showToast(`❌ ${item.name} удалён`);
                }
                updateCart();
                return;
            }

            // Категории
            const catBtn = e.target.closest('.cat-btn');
            if (catBtn) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                catBtn.classList.add('active');
                renderMenu(catBtn.dataset.cat);
                return;
            }

            // Заказ
            if (e.target.id === 'orderBtn' || e.target.closest('#orderBtn')) {
                if (cart.length === 0) {
