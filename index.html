<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safar — заказ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f7f5f0;color:#1e1e1e;min-height:100vh;padding-bottom:100px}
        .header{background:#1e1e1e;color:#fff;padding:14px 20px;position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center}
        .header h1{font-size:22px;font-weight:900;letter-spacing:-0.5px}
        .header h1 span{color:#c9a94e}
        .header .cart-count{background:#c9a94e;color:#1e1e1e;border-radius:40px;padding:4px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer}
        .tabs{display:flex;background:#ede9e4;margin:12px 16px;border-radius:60px;padding:4px}
        .tab{flex:1;text-align:center;padding:10px 0;border-radius:40px;font-weight:700;font-size:14px;cursor:pointer;transition:0.3s;border:none;background:transparent;font-family:'Inter',sans-serif;color:#1e1e1e}
        .tab.active{background:#1e1e1e;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
        .tab:active{transform:scale(0.94)}
        .categories{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}
        .categories::-webkit-scrollbar{display:none}
        .cat-btn{background:#e8e4de;border:none;padding:8px 20px;border-radius:40px;font-weight:600;font-size:14px;color:#1e1e1e;white-space:nowrap;cursor:pointer;transition:0.2s;flex-shrink:0}
        .cat-btn.active{background:#1e1e1e;color:#fff}
        .cat-btn:active{transform:scale(0.94)}
        .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 16px 20px}
        .menu-card{background:#fff;border-radius:24px;padding:16px 14px;border:1px solid #ede9e4;display:flex;flex-direction:column}
        .menu-card:active{transform:scale(0.97)}
        .menu-card .icon{font-size:26px;color:#c9a94e;margin-bottom:4px}
        .menu-card .name{font-weight:700;font-size:16px}
        .menu-card .desc{font-size:12px;color:#8a8580;margin:2px 0 8px}
        .menu-card .price{font-weight:700;font-size:17px;margin-top:auto}
        .menu-card .price span{font-weight:400;font-size:12px;color:#8a8580}
        .menu-card .add-btn{background:#1e1e1e;color:#fff;border:none;border-radius:40px;padding:10px 0;font-weight:700;font-size:13px;cursor:pointer;transition:0.3s;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px}
        .menu-card .add-btn:active{transform:scale(0.94)}
        .menu-card .add-btn.added{background:#c9a94e;color:#1e1e1e}
        .cart-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 20px;border-top:1px solid #ede9e4;display:none;align-items:center;justify-content:space-between;z-index:60;box-shadow:0 -4px 30px rgba(0,0,0,0.04)}
        .cart-bar.active{display:flex}
        .cart-bar .total{font-weight:700;font-size:18px}
        .cart-bar .order-btn{background:#1e1e1e;color:#fff;border:none;border-radius:40px;padding:12px 28px;font-weight:700;font-size:14px;cursor:pointer;transition:0.3s;display:flex;align-items:center;gap:8px}
        .cart-bar .order-btn:active{transform:scale(0.94)}
        .toast{position:fixed;bottom:90px;left:20px;right:20px;background:#1e1e1e;color:#fff;padding:14px 20px;border-radius:60px;font-weight:600;font-size:14px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.12);opacity:0;transform:translateY(10px);transition:all 0.4s;z-index:100;pointer-events:none}
        .toast.show{opacity:1;transform:translateY(0)}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:999;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal{background:#fff;border-radius:32px;padding:24px 20px;max-width:400px;width:100%;max-height:90vh;overflow-y:auto}
        .modal h2{font-size:20px;font-weight:800;margin-bottom:4px}
        .modal .sub{color:#8a8580;font-size:13px;margin-bottom:16px}
        .modal label{font-weight:600;font-size:13px;display:block;margin-top:12px}
        .modal input,.modal textarea{width:100%;padding:12px 14px;border:1.5px solid #e8e4de;border-radius:16px;font-size:14px;font-family:'Inter',sans-serif;background:#faf8f5;outline:none;transition:0.2s;margin-top:4px}
        .modal input:focus,.modal textarea:focus{border-color:#1e1e1e;background:#fff}
        .modal .btn-group{display:flex;gap:10px;margin-top:18px}
        .modal .btn-group button{flex:1;padding:12px;border:none;border-radius:16px;font-weight:700;font-size:14px;cursor:pointer;transition:0.2s}
        .modal .btn-group .cancel{background:#e8e4de;color:#1e1e1e}
        .modal .btn-group .submit{background:#1e1e1e;color:#fff}
        .modal .btn-group button:active{transform:scale(0.94)}
        .order-summary{background:#faf8f5;border-radius:16px;padding:12px;margin:12px 0;font-size:13px}
        .order-summary .item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #ede9e4}
        .order-summary .item:last-child{border:none}
        .order-summary .total-line{font-weight:700;padding-top:6px;margin-top:6px;border-top:1px solid #dedad4}
        .orders-list{display:none;padding:12px 16px 20px}
        .orders-list.active{display:block}
        .order-card{background:#fff;border-radius:20px;padding:16px;border:1px solid #ede9e4;margin-bottom:12px}
        .order-card .order-header{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:4px}
        .order-card .order-header .status{color:#c9a94e}
        .order-card .order-details{font-size:13px;color:#8a8580}
        .order-card .order-details span{display:block;margin-top:2px}
        .order-card .order-total{font-weight:700;margin-top:8px;padding-top:8px;border-top:1px solid #ede9e4}
        .empty-orders{text-align:center;color:#8a8580;padding:40px 20px;font-size:15px}
        .hidden{display:none!important}
        .whatsapp-float{position:fixed;bottom:100px;right:20px;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:50;border:none;cursor:pointer;transition:0.3s}
        .whatsapp-float:active{transform:scale(0.9)}
        @media(max-width:480px){.menu-grid{gap:10px;padding:12px 12px 20px}.menu-card{padding:12px 10px}.menu-card .name{font-size:14px}.menu-card .price{font-size:15px}.cart-bar{padding:10px 16px}.cart-bar .total{font-size:16px}.cart-bar .order-btn{padding:10px 20px;font-size:13px}.modal{padding:20px 16px}}
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <header class="header">
        <h1>SAFAR</h1>
        <div class="cart-count" id="cartCount"><i class="fas fa-shopping-bag"></i> <span id="cartCountNumber">0</span></div>
    </header>

    <div class="tabs">
        <button class="tab active" data-tab="menu">📋 Меню</button>
        <button class="tab" data-tab="orders">📦 Заказы</button>
    </div>

    <div id="menuSection">
        <div class="categories" id="categories">
            <button class="cat-btn active" data-cat="all">Все</button>
            <button class="cat-btn" data-cat="coffee">Кофе</button>
            <button class="cat-btn" data-cat="dessert">Десерты</button>
            <button class="cat-btn" data-cat="drinks">Напитки</button>
        </div>
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <div class="orders-list" id="ordersSection">
        <div id="ordersContainer"></div>
    </div>

    <div class="cart-bar" id="cartBar">
        <span class="total" id="cartTotal">0 ₽</span>
        <button class="order-btn" id="openOrderModal"><i class="fas fa-check"></i> Заказать</button>
    </div>

    <!-- Кнопка WhatsApp (плавающая) -->
    <button class="whatsapp-float" id="whatsappFloat" title="Связаться с нами">
        <i class="fab fa-whatsapp"></i>
    </button>

    <!-- Модалка заказа -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal">
            <h2>Оформление заказа</h2>
            <div class="sub">Заполните данные</div>
            <div class="order-summary" id="orderSummary"></div>
            <label>Имя</label>
            <input type="text" id="orderName" placeholder="Ваше имя">
            <label>Телефон</label>
            <input type="tel" id="orderPhone" placeholder="+7 (999) 123-45-67">
            <label>Адрес</label>
            <input type="text" id="orderAddress" placeholder="Улица, дом, квартира">
            <label>Комментарий</label>
            <textarea id="orderComment" rows="2" placeholder="Пожелания..."></textarea>
            <div class="btn-group">
                <button class="cancel" id="closeOrderModal">Отмена</button>
                <button class="submit" id="submitOrder">Подтвердить</button>
            </div>
        </div>
    </div>

    <script>
        // ===== НАСТРОЙКА =====
        // Номер владельца в формате 7XXXXXXXXXX (без +)
        const OWNER_PHONE = "79695270517";  // ЗАМЕНИ НА СВОЙ НОМЕР
        // ===================

        const menu = [
            { id: 1, name: 'Эспрессо', desc: 'Классический крепкий кофе', price: 180, icon: 'fa-mug-saucer', cat: 'coffee' },
            { id: 2, name: 'Капучино', desc: 'Нежный кофе с молочной пенкой', price: 220, icon: 'fa-mug-hot', cat: 'coffee' },
            { id: 3, name: 'Латте', desc: 'Кофе с большим количеством молока', price: 240, icon: 'fa-mug-hot', cat: 'coffee' },
            { id: 4, name: 'Чизкейк', desc: 'Нежный творожный десерт', price: 280, icon: 'fa-cake', cat: 'dessert' },
            { id: 5, name: 'Тирамису', desc: 'Итальянский кофейный десерт', price: 310, icon: 'fa-cake', cat: 'dessert' },
            { id: 6, name: 'Круассан', desc: 'Хрустящая выпечка с начинкой', price: 190, icon: 'fa-bread-slice', cat: 'dessert' },
            { id: 7, name: 'Апельсиновый сок', desc: 'Свежевыжатый сок', price: 160, icon: 'fa-glass', cat: 'drinks' },
            { id: 8, name: 'Матча латте', desc: 'Зелёный чай с молоком', price: 260, icon: 'fa-leaf', cat: 'drinks' },
        ];

        let cart = [];
        let orders = JSON.parse(localStorage.getItem('safar_orders') || '[]');

        function saveOrders() {
            localStorage.setItem('safar_orders', JSON.stringify(orders));
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function renderMenu(category = 'all') {
            const grid = document.getElementById('menuGrid');
            const filtered = category === 'all' ? menu : menu.filter(i => i.cat === category);
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-orders">В этой категории пока ничего нет</div>`;
                return;
            }
            grid.innerHTML = filtered.map(item => {
                const inCart = cart.some(c => c.id === item.id);
                return `
                    <div class="menu-card">
                        <div class="icon"><i class="fas ${item.icon}"></i></div>
                        <div class="name">${item.name}</div>
                        <div class="desc">${item.desc}</div>
                        <div class="price">${item.price} <span>₽</span></div>
                        <button class="add-btn ${inCart ? 'added' : ''}" data-id="${item.id}">
                            ${inCart ? '<i class="fas fa-check"></i> В корзине' : '<i class="fas fa-plus"></i> Добавить'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        function updateCartUI() {
            const bar = document.getElementById('cartBar');
            const total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('cartTotal').textContent = total + ' ₽';
            document.getElementById('cartCountNumber').textContent = cart.length;
            if (cart.length > 0) {
                bar.classList.add('active');
            } else {
                bar.classList.remove('active');
            }
            renderMenu(document.querySelector('.cat-btn.active')?.dataset.cat || 'all');
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            if (orders.length === 0) {
                container.innerHTML = `<div class="empty-orders">📭 У вас пока нет заказов</div>`;
                return;
            }
            container.innerHTML = orders.slice().reverse().map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span>🆕 Заказ #${order.id}</span>
                        <span class="status">${order.status || 'Принят'}</span>
                    </div>
                    <div class="order-details">
                        <span><strong>Имя:</strong> ${order.name}</span>
                        <span><strong>Телефон:</strong> ${order.phone}</span>
                        <span><strong>Адрес:</strong> ${order.address}</span>
                        <span><strong>Состав:</strong> ${order.items.map(i => i.name).join(', ')}</span>
                        <span><strong>Комментарий:</strong> ${order.comment || '—'}</span>
                    </div>
                    <div class="order-total">💰 ${order.total} ₽</div>
                </div>
            `).join('');
        }

        function updateOrderSummary() {
            const container = document.getElementById('orderSummary');
            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#8a8580;">Корзина пуста</div>';
                return;
            }
            const total = cart.reduce((s, i) => s + i.price, 0);
            let html = cart.map(item => `
                <div class="item">
                    <span>${item.name}</span>
                    <span>${item.price} ₽</span>
                </div>
            `).join('');
            html += `<div class="total-line">Итого: ${total} ₽</div>`;
            container.innerHTML = html;
        }

        function sendToWhatsApp(name, phone, address, comment, items, total) {
            const itemList = items.map(i => `${i.name} (${i.price}₽)`).join(', ');
            const message = encodeURIComponent(
                `🆕 НОВЫЙ ЗАКАЗ\n\n` +
                `👤 Имя: ${name}\n` +
                `📞 Телефон: ${phone}\n` +
                `📍 Адрес: ${address}\n` +
                `📋 Заказ: ${itemList}\n` +
                `💰 Сумма: ${total} ₽\n` +
                `💬 Комментарий: ${comment || '—'}`
            );
            const url = `https://wa.me/${OWNER_PHONE}?text=${message}`;
            window.open(url, '_blank');
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                if (this.dataset.tab === 'menu') {
                    document.getElementById('menuSection').style.display = 'block';
                    document.getElementById('ordersSection').classList.remove('active');
                } else {
                    document.getElementById('menuSection').style.display = 'none';
                    document.getElementById('ordersSection').classList.add('active');
                    renderOrders();
                }
            });
        });

        document.addEventListener('click', function(e) {
            const addBtn = e.target.closest('.add-btn');
            if (addBtn) {
                const id = parseInt(addBtn.dataset.id);
                const item = menu.find(i => i.id === id);
                if (!item) return;
                const idx = cart.findIndex(c => c.id === id);
                if (idx === -1) {
                    cart.push({ ...item });
                    showToast(`✅ ${item.name} добавлен`);
                } else {
                    cart.splice(idx, 1);
                    showToast(`❌ ${item.name} удалён`);
                }
                updateCartUI();
                return;
            }

            const catBtn = e.target.closest('.cat-btn');
            if (catBtn) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                catBtn.classList.add('active');
                renderMenu(catBtn.dataset.cat);
                return;
            }

            if (e.target.id === 'openOrderModal' || e.target.closest('#openOrderModal')) {
                if (cart.length === 0) {
                    showToast('🛒 Корзина пуста');
                    return;
                }
                updateOrderSummary();
                document.getElementById('orderModal').classList.add('active');
                return;
            }

            if (e.target.id === 'closeOrderModal' || e.target.closest('#closeOrderModal')) {
                document.getElementById('orderModal').classList.remove('active');
                return;
            }

            if (e.target.id === 'submitOrder' || e.target.closest('#submitOrder')) {
                const name = document.getElementById('orderName').value.trim();
                const phone = document.getElementById('orderPhone').value.trim();
                const address = document.getElementById('orderAddress').value.trim();
                const comment = document.getElementById('orderComment').value.trim();

                if (!name || !phone || !address) {
                    showToast('⚠️ Заполните имя, телефон и адрес');
                    return;
                }

                const total = cart.reduce((s, i) => s + i.price, 0);
                const newOrder = {
                    id: Date.now().toString().slice(-6),
                    name,
                    phone,
                    address,
                    comment: comment || '—',
                    items: [...cart],
                    total,
                    status: 'Принят',
                    date: new Date().toLocaleString('ru-RU')
                };
                orders.push(newOrder);
                saveOrders();

                // Отправка в WhatsApp
                sendToWhatsApp(name, phone, address, comment, cart, total);

                document.getElementById('orderModal').classList.remove('active');
                cart = [];
                updateCartUI();
                showToast('✅ Заказ отправлен в WhatsApp!');

                if (document.querySelector('.tab.active')?.dataset.tab === 'orders') {
                    renderOrders();
                }
                return;
            }

            if (e.target.id === 'whatsappFloat' || e.target.closest('#whatsappFloat')) {
                const url = `https://wa.me/${OWNER_PHONE}`;
                window.open(url, '_blank');
                return;
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('orderModal').classList.remove('active');
            }
        });

        renderMenu('all');
        updateCartUI();
        renderOrders();
    </script>
</body>
  </html>
